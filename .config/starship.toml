"$schema" = "https://starship.rs/config-schema.json"

palette = "earth"

format = """
[](fg:ink)\
[🌑](bg:ink fg:ink)\
$username\
[](bg:wood fg:ink)\
$hostname\
[](bg:sand fg:wood)\
$directory\
[](fg:sand bg:stone)\
$git_branch\
$git_status\
[](fg:stone bg:wood)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:wood bg:sand)\
$docker_context\
[](fg:sand bg:ink)\
$time\
[ ](fg:ink)\
$line_break$character
"""

# ─────────────────────────────
# Palette
# ─────────────────────────────
[palettes.earth]
paper = "#E7EDF0"
ink   = "#2F170F"
sand  = "#8A6E60"
wood  = "#754E3B"
stone = "#846C62"

# ─────────────────────────────
# OS
# ─────────────────────────────
[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
CachyOS = "🎗️ "
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

# ─────────────────────────────
# Username / Host
# ─────────────────────────────
[username]
show_always = true
style_user = "bg:ink fg:paper"
style_root = "bg:ink fg:paper"
format = "[ $user]($style)"

[hostname]
ssh_only = false
ssh_symbol = "Ö"
format = "[🐧$ssh_symbol$hostname]($style)"
style = "bg:wood fg:paper"

# ─────────────────────────────
# Directory
# ─────────────────────────────
[directory]
style = "fg:ink bg:sand"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ─────────────────────────────
# Git
# ─────────────────────────────
[git_branch]
symbol = ""
style = "bg:stone"
format = '[[ $symbol $branch ](fg:paper bg:stone)]($style)'

[git_status]
style = "bg:stone"
format = '[[($all_status$ahead_behind )](fg:paper bg:stone)]($style)'

# ─────────────────────────────
# Languages
# ─────────────────────────────
[nodejs]
symbol = ""
style = "bg:wood"
format = '[[ $symbol( $version) ](fg:paper bg:wood)]($style)'

[c]
symbol = " "
style = "bg:wood"
format = '[[ $symbol( $version) ](fg:paper bg:wood)]($style)'

[rust]
symbol = ""
style = "bg:wood"
format = '[[ $symbol( $version) ](fg:paper bg:wood)]($style)'

[golang]
symbol = ""
style = "bg:wood"
format = '[[ $symbol( $version) ](fg:paper bg:wood)]($style)'

[php]
symbol = ""
style = "bg:wood"
format = '[[ $symbol( $version) ](fg:paper bg:wood)]($style)'

[java]
symbol = " "
style = "bg:wood"
format = '[[ $symbol( $version) ](fg:paper bg:wood)]($style)'

[kotlin]
symbol = ""
style = "bg:wood"
format = '[[ $symbol( $version) ](fg:paper bg:wood)]($style)'

[haskell]
symbol = ""
style = "bg:wood"
format = '[[ $symbol( $version) ](fg:paper bg:wood)]($style)'

[python]
symbol = ""
style = "bg:wood"
format = '[[ $symbol( $version) ](fg:paper bg:wood)]($style)'

# ─────────────────────────────
# Docker
# ─────────────────────────────
[docker_context]
symbol = ""
style = "bg:sand"
format = '[[ $symbol( $context) ](fg:ink bg:sand)]($style)'

# ─────────────────────────────
# Time
# ─────────────────────────────
[time]
disabled = false
time_format = "%R"
style = "bg:ink"
format = '[[  $time ](fg:paper bg:ink)]($style)'

# ─────────────────────────────
# Prompt
# ─────────────────────────────
[character]
success_symbol = "[](bold fg:sand)"
error_symbol   = "[](bold fg:wood)"
vimcmd_symbol  = "[](bold fg:stone)"

